services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    ports:
      - "127.0.0.1:9000:8333"
    environment:
      # Omitting AWS creds keeps SeaweedFS in development allow-all mode.
      # The app still sends its local dev credentials from .env.development.
      S3_BUCKET: tidepost-dev
    volumes:
      - seaweedfs-data:/data
    restart: unless-stopped

seaweedfs-data:
