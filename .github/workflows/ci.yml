name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref: a new push cancels the outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .nvmrc sets the Node version; pnpm/action-setup reads the pnpm
      # version from packageManager in package.json.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      # Worker tests run inside workerd with a fake Instagram API.
      - run: pnpm test
      - run: pnpm run build
