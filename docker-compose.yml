# Production Docker Compose — deploy as a Coolify Service Stack.
# Coolify auto-detects ${VAR_NAME} syntax and creates UI fields for each.
# Do NOT expose ports here — Coolify's Traefik handles external routing.

services:
  client:
    image: ${CLIENT_IMAGE:-ghcr.io/trebeljahr/tidepost-client:main}
    # Always re-pull the tag before starting. Without this, Docker keeps
    # the image it already has for a mutable tag like `:main` and a deploy
    # silently runs the PREVIOUS build: the container comes up healthy,
    # Coolify reports the new commit, ghcr's `main` points at the new
    # digest, and the served code is still the old one. The deploy job
    # also pins SERVER_IMAGE/CLIENT_IMAGE to the commit sha, which removes
    # the ambiguity entirely — this covers the `:main` default that a
    # hand-run `docker compose up` still uses.
    pull_policy: always
    environment:
      # Pin client port — Coolify's app-level PORT (set for the server)
      # would otherwise bleed into every service.
      PORT: "6402"
      # No drain under compose — see the server service above.
      SHUTDOWN_DRAIN_SECONDS: "0"
      # Deliberately NO NEXT_PUBLIC_* here: Next.js inlines those into
      # the browser bundle when the image is BUILT, so runtime env on
      # this prebuilt container cannot affect them. They are passed as
      # Docker build args in .github/workflows/build-and-deploy.yml.
    restart: unless-stopped
    pids_limit: 512

