packages:
  - "packages/*"

# Security backports for transitive dependencies that have not picked up the
# fixed versions yet. Drop an entry once `pnpm why <name>` shows only fixed
# versions without it.
overrides:
  "brace-expansion@>=1 <2": "^1.1.18"
  "brace-expansion@>=5 <6": "^5.0.9"
  "postcss@>=8 <8.5.23": "^8.5.23"
  "nanoid@>=3 <3.3.18": "^3.3.18"
  "undici@>=7 <7.29.1": "^7.29.1"
  "sharp@>=0.34 <0.35.4": "^0.35.4"
  "esbuild@>=0.27 <0.28.1": "^0.28.1"

# Packages allowed to run install scripts. pnpm 11 refuses any other package's
# build step (ERR_PNPM_IGNORED_BUILDS), so add one here when a new dependency
# needs it.
allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
